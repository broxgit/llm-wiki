# Every push to main reaches plugin users with auto-update on, so nothing merges
# to main without these passing. See docs/maintaining.md.
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning wiki.sh hooks/session-start.sh hooks/pre-tool-use.sh hooks/pre-commit scripts/migrate-to-plugin.sh scripts/helper.sh tests/smoke.sh tests/smoke-parts.sh
      - name: The smoke matrix runs every part of the suite
        run: test "$(tests/smoke.sh --list | cut -f 1 | sort -un | paste -sd ' ' -)" = "1 2 3 4"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate the plugin and marketplace
        run: npx --yes @anthropic-ai/claude-code@2.1.170 plugin validate .

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Only the helper's own packages: tour/ holds Go that is sample code for the tour.
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: go vet
        run: go vet ./cmd/... ./internal/...
      - name: go test
        run: go test ./cmd/... ./internal/...

  # The released helper must be exactly what helper.lock says, on a machine that isn't
  # the one that wrote the lock. The lock names the compiler, and go fetches it.
  helper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # go.mod says go 1.22, so go-version-file installs a 1.22 and every run then
      # downloads the lock's compiler from proxy.golang.org. Install that one instead.
      - name: Read the compiler helper.lock names
        id: toolchain
        run: echo "version=$(sed -n 's/^toolchain go//p' helper.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache: false
      - name: Build every platform and compare with helper.lock
        run: scripts/helper.sh check dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helper
          path: dist/
      # Published from the pull request, before the merge, so the release is there by
      # the time anyone's wiki.sh names it. It is named by the hash of its source, and
      # wiki.sh checks what it downloads against helper.lock, so publishing early can't
      # hand anyone the wrong bytes. A pull request from a fork can't publish.
      # A prerelease, so GitHub doesn't show a helper as the project's latest release.
      - name: Publish the release, if it isn't there yet
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          src="$(sed -n 's/^source //p' helper.lock)"
          tag="helper-$src"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already published"
            exit 0
          fi
          # A push and a pull request can run this at once. Whichever loses finds it there.
          gh release create "$tag" dist/llm-wiki-* --target "$TARGET" --prerelease \
            --title "Helper $src" \
            --notes "The llm-wiki helper built from source $src. wiki update downloads it and keeps it only if it matches helper.lock. There is nothing to install by hand." \
            || gh release view "$tag" >/dev/null

  # The suite runs in parts, side by side, as tests/smoke.sh --part <n>: on macOS the
  # whole of it took nine minutes. The parts list must match the table at the top of
  # tests/smoke.sh, which the lint job checks. docs/maintaining.md has how to change it.
  smoke:
    name: smoke part ${{ matrix.part }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        part: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The same pinned release on both systems, with retries: a Homebrew download
      # failed once and turned a green build red.
      - name: Install gitleaks
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) asset=linux_x64 ;;
            macOS-ARM64) asset=darwin_arm64 ;;
            macOS-X64) asset=darwin_x64 ;;
            *) echo "no gitleaks build for ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          sudo mkdir -p /usr/local/bin
          curl -sSfL --retry 5 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_${asset}.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks
          gitleaks version
      # macOS runners put a newer bash first on the PATH. Most Macs run Apple's
      # bash 3.2, so test with that one.
      - name: Use Apple's bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      # With Go there, the smoke tests build the helper and compare it with the code
      # it stands in for. It is the compiler helper.lock names, so building the release
      # helper doesn't download one from proxy.golang.org, which failed once.
      - name: Read the compiler helper.lock names
        id: toolchain
        run: echo "version=$(sed -n 's/^toolchain go//p' helper.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache: false
      - name: Smoke tests
        run: |
          bash --version | head -n 1
          SMOKE_TIMES=1 tests/smoke.sh --part ${{ matrix.part }}

  # Branch protection requires checks named smoke (ubuntu-latest) and smoke (macos-latest),
  # from before the parts. These pass when every part passed, on both systems.
  smoke-result:
    name: smoke (${{ matrix.os }})
    needs: smoke
    if: always()
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.smoke.result }}" = success
