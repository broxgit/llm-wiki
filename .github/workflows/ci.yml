# Every push to main reaches plugin users with auto-update on, so nothing merges
# to main without these passing. See docs/maintaining.md.
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning wiki.sh hooks/session-start.sh hooks/pre-commit scripts/migrate-to-plugin.sh tests/smoke.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate the plugin and marketplace
        run: npx --yes @anthropic-ai/claude-code@2.1.170 plugin validate .

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The same pinned release on both systems, with retries: a Homebrew download
      # failed once and turned a green build red.
      - name: Install gitleaks
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) asset=linux_x64 ;;
            macOS-ARM64) asset=darwin_arm64 ;;
            macOS-X64) asset=darwin_x64 ;;
            *) echo "no gitleaks build for ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          sudo mkdir -p /usr/local/bin
          curl -sSfL --retry 5 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_${asset}.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks
          gitleaks version
      # macOS runners put a newer bash first on the PATH. Most Macs run Apple's
      # bash 3.2, so test with that one.
      - name: Use Apple's bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - name: Smoke tests
        run: |
          bash --version | head -n 1
          tests/smoke.sh
